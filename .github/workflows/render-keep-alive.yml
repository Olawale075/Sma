name: Keep Render service awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render health endpoint
        env:
          RENDER_URL: ${{ vars.RENDER_URL || 'https://fireeyes-detector-ib01.onrender.com' }}
        run: |
          if [ -z "$RENDER_URL" ]; then
            echo "Set the RENDER_URL repository variable to your Render service URL."
            exit 1
          fi
          response="$(curl --fail --silent --show-error --max-time 30 \
            "${RENDER_URL%/}/api/health")"
          echo "$response" | jq --exit-status '.status == "UP"'
