# AI provider configuration
# Gemini remains the primary provider, but OpenAI is supported as a fallback.
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=gemini-3.8-flash
gemini.endpoint=https://generativelanguage.googleapis.com/v1beta/models
gemini.max-retries=6
gemini.retry-initial-delay-ms=1500
gemini.retry-max-delay-ms=30000

openai.api-key=${OPENAI_API_KEY:}
openai.model=gpt-4o-mini
openai.endpoint=https://api.openai.com/v1
openai.max-retries=3

# Legacy generic model settings kept for reference
ai.model.artifact-id=resnet18
ai.model.engine=PyTorch
ai.model.top-k=5
ai.model.image-width=224
ai.model.image-height=224

# Disease Detection Thresholds
ai.detection.confidence-threshold=0.65
ai.detection.min-confidence=0.5

# Logging for AI

logging.level.sms.com.sms.service.ObjectDetectionService=DEBUG
# WebSocket Configuration
spring.websocket.server.max-buffer-size=2097152
spring.websocket.server.max-message-size=2097152
spring.websocket.server.max-session-idle-timeout=300000

# CORS
spring.web.cors.allowed-origins=*
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true



## Database
#spring.datasource.url=jdbc:postgresql://localhost:5432/fireeye_db
#spring.datasource.username=postgres
#spring.datasource.password=your_password
#spring.datasource.driver-class-name=org.postgresql.Driver

# Hikari Connection Pool
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.leak-detection-threshold=60000

# JPA
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.batch_size=25

# WebSocket
spring.websocket.max-text-message-size=1048576
spring.websocket.max-binary-message-size=1048576
spring.websocket.send-timeout=5000
spring.websocket.send-buffer-size=1048576
spring.websocket.receive-buffer-size=1048576

# Server

server.servlet.context-path=/
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
server.tomcat.connection-timeout=60000
server.tomcat.max-keep-alive-requests=100
server.tomcat.keep-alive-timeout=60000
server.tomcat.max-connections=200
server.tomcat.accept-count=100
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=10
server.tomcat.accesslog.enabled=true


jwt.expiration=86400000
jwt.refresh-expiration=604800000
jwt.issuer=FireEye-System

# Logging
logging.level.root=INFO
logging.level.sms.com.sms=DEBUG
logging.level.sms.com.sms.config.CameraWebSocketHandler=DEBUG

logging.level.com.zaxxer.hikari=INFO
logging.level.org.hibernate=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n
logging.file.name=logs/fireeye-application.log

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,websocket
management.endpoints.web.base-path=/actuator
management.endpoint.health.show-details=always
management.metrics.tags.application=FireEye

# Swagger
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.try-it-out-enabled=true

# Detection Service
detection.model.type=resnet18
detection.model.download=true
detection.model.cache=models/cache

detection.detection.enabled=true
detection.detection.confidence-threshold=0.5
detection.detection.max-detections=10
detection.detection.image-size=224
detection.detection.device=cpu
detection.detection.threads=4

detection.mock.enabled=false
detection.rate-limit.max-fps=5.0
detection.rate-limit.max-queue-size=100
detection.rate-limit.max-sessions=50
detection.performance.async=true
detection.performance.pool-size=10


# Custom
app.name=FireEye Crop Disease Detection
app.version=1.0.0
app.environment=development
app.cors.allowed-origins=http://localhost:3000,http://localhost:8080,http://192.168.0.100:8080
app.cors.allow-credentials=true
